name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: wasm-gc
          - os: ubuntu-latest
            target: js
          - os: ubuntu-latest
            target: native
          - os: windows-latest
            target: native
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - uses: hustcer/setup-moonbit@v1
      - name: Toolchain versions
        run: moon version --all
      - name: Check
        run: moon check --target ${{ matrix.target }} --deny-warn
      - name: Build
        run: moon build --target ${{ matrix.target }}
      - name: Test
        run: moon test --target ${{ matrix.target }} --deny-warn
      - name: Run equation example
        run: moon run examples/equations --target ${{ matrix.target }}
      - name: Run interactive layout example
        run: moon run examples/split_pane --target ${{ matrix.target }}
      - name: Run recovery example
        run: moon run examples/recovery --target ${{ matrix.target }}
      - name: Run asserted multi-panel layout example
        run: moon run examples/panels --target ${{ matrix.target }}

      - name: Run checked incremental edit benchmark (release)
        if: matrix.target == 'native'
        run: moon run bench/main --target native --release

  reproducibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hustcer/setup-moonbit@v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test-only reference implementation
        run: python -m pip install kiwisolver==1.4.9
      - name: Check formatting
        run: moon fmt --check
      - name: Check generated interface
        run: |
          moon info
          git diff --exit-code -- '*.mbti'
      - name: Reproduce independent oracle fixtures
        run: python tests/oracle/generate.py --check
